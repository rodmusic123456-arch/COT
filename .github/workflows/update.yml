name: Update dashboard

on:
  schedule:
    # Friday 23:00 UK time. GitHub schedules in UTC only, so there are two entries
    # (22:00 UTC = 23:00 BST, 23:00 UTC = 23:00 GMT) and the gate step below lets
    # through only the one that is 23:00 in London.
    - cron: '0 22 * * 5'
    - cron: '0 23 * * 5'
    # Monday catch-up (in case a Friday run was missed or the release was late).
    - cron: '30 17 * * 1'
    # Daily price refresh, after the markets have closed for the day.
    - cron: '30 22 * * 1-4'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/data-loader.js'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/update.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Gate (Friday schedule only runs at 23:00 London time)
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 22 * * 5"|"0 23 * * 5")
                if [ "$(TZ=Europe/London date +%H)" != "23" ]; then run=false; fi ;;
            esac
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run (London time now: $(TZ=Europe/London date))"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22

      - name: Tests
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Download data and rebuild
        if: steps.gate.outputs.run == 'true'
        run: npm run update

      - name: Save data back to the repository
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "cot-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.run == 'true'
        with:
          path: docs

  deploy:
    needs: update
    if: needs.update.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
