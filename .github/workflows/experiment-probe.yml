# EXPERIMENT ONLY: runs on pushes to the "experiment" branch, never on main, never publishes the site.
name: Experiment - probe macro sources
on:
  push:
    branches: [experiment]
    paths: ['experiment/probe-*.js', 'experiment/macro*.js', '.github/workflows/experiment-probe.yml']
permissions:
  contents: write
concurrency:
  group: experiment
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in experiment/probe-*.js; do node "$f"; done
      - run: if [ -f experiment/macro-fetch.js ]; then node experiment/macro-fetch.js; fi
      - name: Commit results to the experiment branch
        run: |
          git config user.name "cot-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add experiment/data
          git diff --cached --quiet || git commit -m "Experiment: macro probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin experiment && git push origin HEAD:experiment
